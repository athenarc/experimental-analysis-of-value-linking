setting_name: CHESS_IR_CG_UT_Qwen-prec-001/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8

team_agents:
  information_retriever:
    engine: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
    tools:
      extract_keywords:
        template_name: 'extract_keywords'
        engine_config:
          engine_name: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
          temperature: 0.2
        parser_name: 'python_list_output_parser'
      retrieve_entity: {}
      retrieve_context:
        top_k: 5

  candidate_generator:
    engine: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
    tools:
      generate_candidate:
        generator_configs:
          - template_name: 'generate_candidate_one'
            engine_config:
              engine_name: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
              temperature: 0.7
            parser_name: 'generate_candidate_gemini_markdown_cot'
            sampling_count: 3
          #- template_name: 'generate_candidate_two'
          #  engine_config:
          #    engine_name: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
          #    temperature: 0.5
          #  parser_name: 'generate_candidate_gemini_markdown_cot'
          #  sampling_count: 3

      revise:
        template_name: 'revise_one'
        engine_config:
          engine_name: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
          temperature: 0.7
        parser_name: 'revise_new'

  unit_tester:
    engine: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
    tools:
      generate_unit_test:
        template_name: 'generate_unit_tests'
        engine_config:
          engine_name: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
          temperature: 0.7
        parser_name: 'generate_unit_tests'
        unit_test_count: 2
        sampling_count: 3

      evaluate:
        template_name: 'evaluate'
        engine_config:
          engine_name: 'Qwen/Qwen2.5-Coder-32B-Instruct-GPTQ-Int8'
          temperature: 0.7
        parser_name: 'evaluate'